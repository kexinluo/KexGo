[package]
name = "kexgo"
version = "0.1.0"
description = "KexGo — a quiet local music player with a quick lyric aligner"
authors = ["KexGo"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "kexgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.18"
rodio = { version = "0.19", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
